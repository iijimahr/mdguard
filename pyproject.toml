[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mdguard"
version = "0.1.0"
description = "Check Markdown math rendering, indexes, relative links, and documentation limits"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
mdguard = "mdguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdguard = ["cases.json"]
